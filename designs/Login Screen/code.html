<style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f7faf8 0%, #e0e3e1 100%); /* Soft gradient background approximating teal/mint hints */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(15, 118, 110, 0.08);
        }
    </style>

<body class="text-on-surface">
<!-- Main Container - Mobile Login Screen -->
<main class="w-full max-w-md mx-auto">
<!-- Glassmorphism Card -->
<div class="glass-card rounded-2xl p-lg flex flex-col items-center">
<!-- Logo Container -->
<div class="w-48 h-auto mb-xl flex justify-center items-center">
<img alt="ClinicFlow Logo" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFiOal78yZo-mIULyRnFY23BzcqO4Z_YRh8EyKkPqWluoVM1NjRT0H3r6Dd0ZITc_beNMRBKDD-bdFWV8sxQLTAWPmJnMgJE7007Q_VBqwyqzmP6OJ-SedPWpxEVmoK8RjRziHKt40HOL5Wz00fcss7fyV5a2WV8RkXQMKozD5ffDrbt-EolHXBEqH8RaeqGAN6fIcIRp_wUpu9Qf1gUyWjmqgstpfav3ij9Cc0M0cM2uaDYSxCpcfBw"/>
</div>
<!-- Welcome Text -->
<div class="text-center mb-md w-full">
<h1 class="font-headline-md text-headline-md text-primary mb-xs">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please log in to your account.</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-sm" method="POST" onsubmit="event.preventDefault();">
<!-- Input Group: Email/Phone -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-xs ml-1" for="identifier">Email or Phone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-container-low focus:bg-white text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 border-none ring-1 ring-inset ring-outline-variant focus:ring-2 focus:ring-inset focus:ring-primary transition-all shadow-sm outline-none" id="identifier" name="identifier" placeholder="Enter your email or phone" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-xs ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low focus:bg-white text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 border-none ring-1 ring-inset ring-outline-variant focus:ring-2 focus:ring-inset focus:ring-primary transition-all shadow-sm outline-none" id="password" name="password" placeholder="Enter your password" type="password"/>
</div>
</div>
<!-- Actions Container -->
<div class="flex flex-col items-center gap-md mt-sm">
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-body-md text-body-md font-bold rounded-lg py-3 transition-colors flex items-center justify-center gap-2" type="submit">
                        Login
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Forgot Password Link -->
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors underline decoration-transparent hover:decoration-current underline-offset-4" href="#">
                        Forgot password?
                    </a>
</div>
</form>
</div>
</main>
</body></html>
