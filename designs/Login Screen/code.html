<style>
        .glass-card {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(15, 118, 110, 0.08);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0F766E 0%, #9cf2e8 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="gradient-bg min-h-screen flex items-center justify-center p-gutter font-body-md text-on-surface antialiased">
<!-- Login Container -->
<main class="w-full max-w-md mx-auto">
<div class="glass-card rounded-2xl p-8 sm:p-10 flex flex-col gap-8">
<!-- Header -->
<header class="flex flex-col items-center gap-3 text-center">
<div class="w-12 h-12 rounded-xl bg-primary-container text-on-primary-container flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-3xl">monitor_heart</span>
</div>
<div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">ClinicFlow</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Secure practitioner access</p>
</div>
</header>
<!-- Form -->
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="identifier">Email or Phone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70">person</span>
<input class="w-full bg-surface-container-low/60 border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-on-surface focus:border-primary-fixed focus:ring-2 focus:ring-primary-fixed/50 transition-colors" id="identifier" name="identifier" placeholder="Enter your email or phone" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70">lock</span>
<input class="w-full bg-surface-container-low/60 border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-on-surface focus:border-primary-fixed focus:ring-2 focus:ring-primary-fixed/50 transition-colors" id="password" name="password" placeholder="Enter your password" type="password"/>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary-container hover:bg-primary text-on-primary rounded-xl py-3.5 font-label-md text-label-md transition-colors shadow-md active:scale-[0.98]" type="button">
                        Login to ClinicFlow
                    </button>
</div>
</form>
<!-- Footer -->
<footer class="text-center">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors underline-offset-4 hover:underline" href="#">
                    Forgot your password?
                </a>
</footer>
</div>
</main>
</body></html>
