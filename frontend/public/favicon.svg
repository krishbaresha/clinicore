<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>

    <!-- Emerald Glow / Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.5" />
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base App Icon Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Internal Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.3" />

  <!-- Main Medical Geometric Cross & Leaf Combination -->
  <g filter="url(#dropShadow)">
    <!-- Vertical Bar of Cross -->
    <rect x="220" y="112" width="72" height="288" rx="24" fill="url(#crossGrad)" />
    
    <!-- Horizontal Bar of Cross -->
    <rect x="112" y="220" width="288" height="72" rx="24" fill="url(#crossGrad)" />
    
    <!-- Center Core Glow Dot -->
    <circle cx="256" cy="256" r="22" fill="#0f766e" />
    <circle cx="256" cy="256" r="14" fill="#34d399" />
  </g>

  <!-- Organic Healing Leaf Element (Homeopathic & Pharmacy Symbolism) -->
  <path d="M 256 256 C 290 190, 370 180, 396 156 C 396 196, 380 276, 256 256 Z" 
        fill="url(#emeraldGrad)" 
        filter="url(#softGlow)" />
        
  <!-- Leaf Stem & Pulse Accent Line -->
  <path d="M 256 256 Q 320 220 380 170" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-opacity="0.9" />

  <!-- Heartbeat ECG / Pulse Line Accent running across bottom -->
  <path d="M 120 376 L 190 376 L 214 340 L 238 412 L 266 330 L 290 392 L 306 376 L 392 376" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#softGlow)" />
</svg>