    <!-- Enterprise Self-Healing Asset & PWA Cache Recovery Engine -->
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (
            (target.tagName === 'LINK' && target.rel === 'stylesheet') ||
            (target.tagName === 'SCRIPT' && target.src && target.src.indexOf('/assets/') !== -1)
          )) {
            console.warn('[Self-Healing Engine] Asset mismatch detected:', target.src || target.href);
            var reloadKey = 'cf_asset_heal_' + (target.src || target.href);
            if (!sessionStorage.getItem(reloadKey)) {
              sessionStorage.setItem(reloadKey, '1');
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }).then(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            }
          }
        }, true);
      })();
    </script>
