<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CliniCore — Clinic &amp; Wholesale Pharmacy Management System</title>
    <meta name="description" content="CliniCore &amp; DrCreate — Offline-first Clinic &amp; Wholesale Pharmacy Management System (clinicore.me)." />
    
    <!-- PWA Manifest & Mobile Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#005c55" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CliniCore" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Google Fonts: Hanken Grotesk + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✅ ClinicFlow PWA Service Worker registered:', reg.scope))
            .catch((err) => console.log('⚠️ Service Worker registration note:', err));
        });
      }
    </script>
  </body>
</html>
