    <!-- Material Symbols & Typography Webfonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      html, body {
        background-color: #0f172a;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
    </style>
    <!-- Dev & Tauri localhost service worker and cache purge guard -->
    <script>
      (function() {
        if (typeof window !== "undefined" && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")) {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ("caches" in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            }).catch(function() {});
          }
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root">
      <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background-color:#0f172a;color:#fff;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:3px solid rgba(20,184,166,0.2);border-top-color:#14b8a6;border-radius:50%;animation:cf-spin 0.8s linear infinite;margin:0 auto 12px;"></div>
          <div style="font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#2dd4bf;">CliniCore</div>
        </div>
      </div>
    </div>
    <style>
      @keyframes cf-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
