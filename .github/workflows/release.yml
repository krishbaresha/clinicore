name: Build and Publish Desktop Release - CliniCore

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.5.3)'
        required: true
        default: 'v2.5.3'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Tauri Windows Desktop & Publish GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Compile Native Windows Desktop Binaries (Tauri 2.0)
        working-directory: ./frontend
        run: npx @tauri-apps/cli build

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: CliniCore ${{ github.ref_name || inputs.release_tag }} - Desktop & Web Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/clinicflow.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
