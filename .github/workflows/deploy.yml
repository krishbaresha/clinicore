name: Production CI/CD Pipeline - CliniCore / ClinicFlow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: AST Scan, Lint & Full Master Test Suite Validation
  # ---------------------------------------------------------------------------
  validate-and-test:
    name: Validate & Run Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Step 0 - Secrets & Credentials Leak Detection
        run: node scripts/scan_secrets.mjs

      - name: Step 1 - AST Hook & Symbol Scope Verification
        run: node scripts/scan_imports_and_hooks.mjs

      - name: Step 2 - Oxlint Static Code Analysis
        working-directory: ./frontend
        run: npx oxlint --quiet

      - name: Step 3 - Execute Master Verification Suite (42 Suites)
        working-directory: ./frontend
        run: node scripts/test_full_suite.mjs

  # ---------------------------------------------------------------------------
  # STAGE 2: Production Build & Bundle Size Budget Enforcement
  # ---------------------------------------------------------------------------
  build-and-budget:
    name: Vite Production Build & Budget Check
    needs: [ validate-and-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile Production Bundle & OTA Dist Zip
        working-directory: ./frontend
        run: |
          npm run build
          cd dist && zip -r dist.zip .

      - name: Post-Build Production Bundle Secret Scan
        run: node scripts/scan_secrets.mjs

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinicore-dist-bundle
          path: frontend/dist/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # STAGE 3: Automated Continuous Deployment to Hostinger VPS (Gated)
  # ---------------------------------------------------------------------------
  deploy-vps:
    name: Gated Deployment to Hostinger VPS
    needs: [ build-and-budget ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Backend + Config to VPS via SSH (Attempt 1)
        id: deploy_backend_attempt_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 77.37.45.233
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 25s
          command_timeout: 5m
          envs: GH_TOKEN
          script: |
            set -e
            echo "🚀 Deploying CliniCore backend & config..."
            cd /var/www/clinicore

            git config --global --add safe.directory /var/www/clinicore
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/krishbaresha/clinicore.git"
            git fetch origin main
            git reset --hard origin/main

            bash /var/www/clinicore/scripts/vps_fix_all.sh || true
            echo "✅ Backend deployed!"

      - name: Wait briefly before retry
        if: steps.deploy_backend_attempt_1.outcome == 'failure'
        run: sleep 5

      - name: Deploy Backend + Config to VPS via SSH (Retry)
        if: steps.deploy_backend_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 77.37.45.233
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 25s
          command_timeout: 5m
          envs: GH_TOKEN
          script: |
            set -e
            echo "🚀 Deploying CliniCore backend & config (retry)..."
            cd /var/www/clinicore

            git config --global --add safe.directory /var/www/clinicore
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/krishbaresha/clinicore.git"
            git fetch origin main
            git reset --hard origin/main

            bash /var/www/clinicore/scripts/vps_fix_all.sh || true
            echo "✅ Backend deployed!"

      - name: Download Pre-Built Production Dist Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: clinicore-dist-bundle
          path: ./dist-bundle

      - name: Upload Pre-Built Dist to VPS via SCP
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 77.37.45.233
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          source: "dist-bundle/*"
          target: "/var/www/clinicore/frontend/dist"
          strip_components: 1
          overwrite: true

      - name: Publish Release Installer to VPS Downloads Vault
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 77.37.45.233
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 25s
          script: |
            mkdir -p /var/www/clinicore/frontend/dist/downloads
            chown -R www-data:www-data /var/www/clinicore/frontend/dist
            chmod -R 755 /var/www/clinicore/frontend/dist
            systemctl restart clinicore-api || true
            systemctl restart clinicore-node-api || true
            nginx -t && systemctl reload nginx || true
            echo "🎉 CliniCore VPS Deployment & Installer Release completed successfully!"

